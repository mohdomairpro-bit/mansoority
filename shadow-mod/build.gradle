plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = '1.0.0'
group = 'com.mansoority.shadow'

base {
    archivesName = 'theshadow-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    // only used by the CI test runs (screenshots + server boot check)
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                theshadow {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'theshadow.autotest', 'true'
            args '--quickPlaySingleplayer', 'autotest', '--width', '1280', '--height', '720'
        }
        server {
            property 'theshadow.servertest', 'true'
            args '--nogui'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title'   : 'theshadow',
            'Specification-Vendor'  : 'Mansoority',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'theshadow',
            'Implementation-Version': project.version,
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
