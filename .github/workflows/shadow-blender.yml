name: Render The Shadow (Blender)
on:
  push:
    branches: [shadow-mod]
    paths: ['shadow-blender/build_shadow.py', 'shadow-blender/anim.py', 'shadow-blender/post.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shadow-blender
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender 4.2 LTS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libxkbcommon0 libsm6 libice6 > /dev/null
          curl -sL -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf blender.tar.xz && mv blender-4.2.3-linux-x64 blender
      - name: Build, export and render
        run: |
          set -o pipefail
          mkdir -p out
          ./blender/blender -b --python-exit-code 1 -P shadow-blender/build_shadow.py -- "$PWD/out" ${{ github.event.inputs.what || 'all' }} 2>&1 | tee out/blender.log
      - name: Skin the mesh and bake the IK clips (SHD3 + SHA2 for the mod)
        if: always()
        run: |
          pip install -q numpy
          cd shadow-blender/tools
          python3 skin.py ../../out/shadow.mesh ../../out/shadow_skinned.mesh
          python3 skin.py ../../out/shadow_lod.mesh ../../out/shadow_lod_skinned.mesh
          python3 clips.py ../../out/shadow.mesh ../../out/clips
          cp ../../out/clips/shadow.anim ../../out/shadow_ik.anim
      - name: Post-process jumpscare frames
        if: always()
        run: |
          pip install -q pillow numpy
          python3 shadow-blender/post.py out || true
          python3 - <<'EOF' || true
          import glob, os, re
          from PIL import Image, ImageFilter
          # previews of each animation clip as gifs
          clips = {}
          for f in sorted(glob.glob("out/anim/*.png")):
              m = re.match(r"(.+)_(\d+)\.png", os.path.basename(f)); clips.setdefault(m.group(1), []).append(f)
          for c, fs in clips.items():
              ims = [Image.open(f).convert("P", palette=Image.ADAPTIVE) for f in fs]
              ims[0].save("out/anim_%s.gif" % c, save_all=True, append_images=ims[1:], duration=100, loop=0)
          # take the sampling noise out of the lit bake
          a = Image.open("out/shadow_atlas.png").convert("RGB")
          a.filter(ImageFilter.MedianFilter(3)).save("out/shadow_atlas.png")
          EOF
          ls -la out
      - name: Publish
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadow-blender-build
          name: The Shadow model renders (auto)
          prerelease: true
          make_latest: false
          body: "Blender build from commit ${{ github.sha }}"
          files: |
            out/*.png
            out/shadow_atlas.png
            out/*.jpg
            out/shadow.mesh
            out/shadow_lod.mesh
            out/shadow.anim
            out/shadow_skinned.mesh
            out/shadow_lod_skinned.mesh
            out/shadow_ik.anim
            out/*.gif
            out/blender.log
            out/jumpscare_strip.jpg
