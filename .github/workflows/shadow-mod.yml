name: Build The Shadow mod
on:
  push:
    branches: [shadow-mod]
    paths: ['shadow-mod/**', '.github/workflows/shadow-mod.yml']
  workflow_dispatch:
concurrency:
  group: shadow-mod
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build
        id: build
        working-directory: shadow-mod
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Server boot test
        id: server
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: shadow-mod
        run: |
          set -o pipefail
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "view-distance=4\nsimulation-distance=4\nspawn-protection=0\nonline-mode=false\n" > run/server.properties
          timeout 900 gradle runServer --no-daemon 2>&1 | tee server.log
          grep -q "SHADOW-SERVERTEST\] OK" server.log

      - name: Client screenshot test
        id: client
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: shadow-mod
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          mkdir -p run/saves
          if [ -d run/world ]; then rm -rf run/saves/autotest && cp -r run/world run/saves/autotest; fi
          export LIBGL_ALWAYS_SOFTWARE=1
          set -o pipefail
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon 2>&1 | tee client.log || true
          mkdir -p shots && cp run/screenshots/*.png shots/ 2>/dev/null || true
          ls -la shots
          grep -q "SHADOW-AUTOTEST\] done" client.log

      - name: Shader-pack screenshot test (Oculus + Embeddium + Complementary)
        id: shader
        if: steps.build.outcome == 'success'
        continue-on-error: true
        working-directory: shadow-mod
        run: |
          pick() { curl -s "https://api.modrinth.com/v2/project/$1/version?loaders=%5B%22$2%22%5D&game_versions=%5B%221.20.1%22%5D" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['$3'])"; }
          export OCULUS_VER=$(pick oculus forge version_number)
          export EMBEDDIUM_VER=$(pick embeddium forge version_number)
          echo "oculus=$OCULUS_VER embeddium=$EMBEDDIUM_VER"
          mkdir -p run/shaderpacks run/config
          URL=$(curl -s "https://api.modrinth.com/v2/project/complementary-reimagined/version?loaders=%5B%22iris%22%5D" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['files'][0]['url'])")
          NAME=$(basename "$URL" | python3 -c "import sys,urllib.parse;print(urllib.parse.unquote(sys.stdin.read().strip()))")
          curl -sL -o "run/shaderpacks/$NAME" "$URL"
          printf "enableShaders=true\nshaderPack=%s\n" "$NAME" > run/config/oculus.properties
          rm -rf run/screenshots; mkdir -p run/saves
          if [ -d run/world ]; then rm -rf run/saves/autotest && cp -r run/world run/saves/autotest; fi
          export LIBGL_ALWAYS_SOFTWARE=1
          timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --no-daemon 2>&1 | tee client_shader.log || true
          mkdir -p shots_shader && for f in run/screenshots/*.png; do cp "$f" "shots_shader/shader_$(basename $f)"; done 2>/dev/null || true
          ls -la shots_shader

      - name: Pack screenshots (one upload instead of dozens)
        if: always()
        run: |
          cd shadow-mod
          zip -q -r shots.zip shots shots_shader 2>/dev/null || true
          ls -la shots.zip || true
      - name: Publish jar, logs, screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadow-mod-build
          name: The Shadow mod (auto build)
          prerelease: true
          make_latest: false
          body: "Auto-built from the shadow-mod branch. Commit ${{ github.sha }}. Build: ${{ steps.build.outcome }} | Server test: ${{ steps.server.outcome }} | Client test: ${{ steps.client.outcome }}"
          files: |
            shadow-mod/build/libs/*.jar
            shadow-mod/build.log
            shadow-mod/server.log
            shadow-mod/client.log
            shadow-mod/shots.zip
            shadow-mod/client_shader.log
