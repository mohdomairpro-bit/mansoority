name: Two-player test (sync)
# a real Forge server with two real clients on it. one starts the boss fight; both record which move it's doing and
# how far into it they are, on the same server ticks, and take screenshots together. then we compare the two.
on:
  workflow_dispatch:
  push:
    branches: [shadow-mod]
    paths: ['shadow-mod/**', '.github/workflows/shadow-multi.yml']
concurrency:
  group: shadow-multi
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  multi:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MC: ${{ github.workspace }}/mc
      FORGE: 1.20.1-47.4.10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
      - name: Build the mod
        working-directory: shadow-mod
        run: gradle build --no-daemon -q && ls build/libs

      - name: Server
        run: |
          mkdir -p srv && cd srv
          curl -sSL -o installer.jar "https://maven.minecraftforge.net/net/minecraftforge/forge/$FORGE/forge-$FORGE-installer.jar"
          java -jar installer.jar --installServer . > install.log 2>&1 || (tail -20 install.log; exit 1)
          mkdir -p mods && cp $(ls ../shadow-mod/build/libs/theshadow-*.jar | grep -v sources | head -1) mods/
          echo "eula=true" > eula.txt
          printf "online-mode=false\nview-distance=6\nsimulation-distance=6\nspawn-protection=0\nmax-tick-time=-1\nallow-flight=true\n" > server.properties
          python3 - <<'EOF'
          import hashlib, uuid, json
          def off(n):
              h = bytearray(hashlib.md5(("OfflinePlayer:" + n).encode()).digest())
              h[6] = (h[6] & 0x0f) | 0x30; h[8] = (h[8] & 0x3f) | 0x80
              return str(uuid.UUID(bytes=bytes(h)))
          json.dump([{"uuid": off(n), "name": n, "level": 4, "bypassesPlayerLimit": False} for n in ("Alpha", "Bravo")], open("ops.json", "w"))
          EOF
          echo "-Xmx3G" > user_jvm_args.txt
          (./run.sh nogui > server.log 2>&1 &)
          for i in $(seq 1 180); do grep -q "Done (" server.log && break; sleep 2; done
          tail -3 server.log

      - name: Clients
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q 'portablemc>=4.4,<5'
          /tmp/venv/bin/portablemc --main-dir "$MC" --work-dir "$MC/a" start --dry "forge:$FORGE" 2>&1 | tail -2
          for w in a b; do
            mkdir -p "$MC/$w/mods" && cp $(ls shadow-mod/build/libs/theshadow-*.jar | grep -v sources | head -1) "$MC/$w/mods/"
            printf "pauseOnLostFocus:false\nrenderDistance:5\nsimulationDistance:5\nonboardAccessibility:false\ntutorialStep:none\nnarrator:0\nmaxFps:60\nskipMultiplayerWarning:true\njoinedFirstServer:true\nsoundCategory_master:0.0\n" > "$MC/$w/options.txt"
          done
          export LIBGL_ALWAYS_SOFTWARE=1
          run() { timeout 3000 xvfb-run -a -s "-screen 0 854x480x24" /tmp/venv/bin/portablemc --main-dir "$MC" --work-dir "$MC/$1" start "forge:$FORGE" \
                  -u "$2" --resolution 854x480 -s 127.0.0.1 "--jvm-args=-Xmx2G -Dtheshadow.multitest=$3" > "client_$1.log" 2>&1; }
          run b Bravo follower &
          sleep 25
          run a Alpha leader &
          wait
          for w in a b; do grep -a "SHADOW-MULTI" "$MC/$w/logs/latest.log" | tail -3; done

      - name: Compare
        if: always()
        run: |
          python3 - <<'EOF' | tee sync_report.txt
          import re, os
          mc = os.environ["MC"]
          def read(w):
              d = {}
              p = os.path.join(mc, w, "logs", "latest.log")
              if not os.path.exists(p): return d
              for l in open(p, errors="ignore"):
                  m = re.search(r"sync gt=(\d+) act=(\d+) el=([\d.]+) phase=(\d) pos=([-\d.]+),([-\d.]+),([-\d.]+)", l)
                  if m: d[int(m[1])] = (int(m[2]), float(m[3]), int(m[4]), float(m[5]), float(m[6]), float(m[7]))
              return d
          a, b = read("a"), read("b")
          both = sorted(set(a) & set(b))
          print("samples: leader", len(a), "follower", len(b), "shared", len(both))
          if both:
              same_act = sum(a[g][0] == b[g][0] for g in both)
              dels = [abs(a[g][1] - b[g][1]) for g in both if a[g][0] == b[g][0]]
              dpos = [((a[g][3]-b[g][3])**2 + (a[g][4]-b[g][4])**2 + (a[g][5]-b[g][5])**2) ** 0.5 for g in both]
              print("same move on both screens: %d/%d" % (same_act, len(both)))
              if dels: print("frame difference within a move: mean %.2f ticks, worst %.1f" % (sum(dels)/len(dels), max(dels)))
              print("position difference: mean %.2f blocks, worst %.2f" % (sum(dpos)/len(dpos), max(dpos)))
              bad = [g for g in both if a[g][0] != b[g][0] or (a[g][0] == b[g][0] and abs(a[g][1]-b[g][1]) > 3)]
              for g in bad[:15]: print("  gt", g, "leader", a[g][:3], "follower", b[g][:3])
          EOF
          mkdir -p multi_shots && cp "$MC"/a/screenshots/*.png "$MC"/b/screenshots/*.png multi_shots/ 2>/dev/null || true
          cp "$MC/a/logs/latest.log" leader.log 2>/dev/null || true; cp "$MC/b/logs/latest.log" follower.log 2>/dev/null || true
          zip -q -r multi_results.zip multi_shots leader.log follower.log srv/server.log sync_report.txt client_a.log client_b.log 2>/dev/null || true
      - name: Publish
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shadow-multi-test
          name: The Shadow with two players (auto test)
          prerelease: true
          make_latest: false
          body: "Two clients on one server, boss fight sync. Commit ${{ github.sha }}."
          files: multi_results.zip
