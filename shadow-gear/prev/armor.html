<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0}canvas{display:block}</style></head><body>
<script src="three.min.js"></script>
<script>
const W = 900, H = 900;
const renderer = new THREE.WebGLRenderer({antialias: false, preserveDrawingBuffer: true});
renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#7a9cc6');
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.set(0.5, 1, -0.8); scene.add(dl);
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 500);
window.ready = false;
(async () => {
  const quads = await (await fetch('/armor/preview_quads.json')).json();
  const tex = await new Promise(r => new THREE.TextureLoader().load('/textures/models/armor/shade_armor.png', t => { t.magFilter = t.minFilter = THREE.NearestFilter; r(t); }));
  const pos = [], uv = [];
  for (const q of quads) for (const i of [0, 1, 2, 0, 2, 3]) { pos.push(q[i][0], q[i][1], q[i][2]); uv.push(q[i][3], 1 - q[i][4]); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshLambertMaterial({map: tex, side: THREE.DoubleSide, alphaTest: 0.1})));
  // a plain player underneath for scale
  const skin = new THREE.MeshLambertMaterial({color: 0x8a6a55});
  const box = (x, y, z, w, h, d) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w * 0.98, h * 0.98, d * 0.98), skin); m.position.set(x + w / 2, y + h / 2, z + d / 2); scene.add(m); };
  box(-4, 24, -4, 8, 8, 8); box(-4, 12, -2, 8, 12, 4); box(4, 12, -2, 4, 12, 4); box(-8, 12, -2, 4, 12, 4); box(-4, 0, -2, 4, 12, 4); box(0, 0, -2, 4, 12, 4);
  window.ready = true;
})();
window.view = (p, t) => { camera.position.set(...p); camera.lookAt(...t); renderer.render(scene, camera); };
</script></body></html>
